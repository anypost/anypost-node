name: Release

# Publishes to npm on a version tag (e.g. v0.1.0). Bump the version in
# package.json (the single source — version.ts is generated from it), tag the
# commit, and push.
#
# Requires an NPM_TOKEN secret (an npm automation token). Publishes with
# provenance, so `id-token: write` is needed.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
