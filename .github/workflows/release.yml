name: Release

# Publishes to npm on a version tag (e.g. v1.0.0). Bump the version in
# package.json (the single source — version.ts is generated from it), tag the
# commit, and push.
#
# Auth is npm Trusted Publishing (OIDC) — no NPM_TOKEN. Configure the trusted
# publisher on npmjs.com (package Settings → Trusted Publisher) to allow this
# repo + workflow. `id-token: write` is required; provenance is generated
# automatically, so no --provenance flag is needed.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing requires npm >= 11.5.1; ensure it regardless of the
      # version bundled with Node.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Publish
        run: npm publish --access public --ignore-scripts
